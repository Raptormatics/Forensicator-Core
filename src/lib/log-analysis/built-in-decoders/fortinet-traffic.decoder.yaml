name: decoder/fortinet-traffic/0
enabled: true

metadata:
  title: 'Fortinet FortiGate Traffic Log Decoder'
  author: 'Forensicator'
  date: '2026-06-24'
  description: >-
    Decoder for Fortinet FortiGate traffic logs in key=value format.
    Extracts source/destination IPs, ports, NAT addresses, application
    identity, policy rules, and traffic action (allow/deny). Consolidated
    version for all traffic log subtypes.
  references:
    - 'https://docs.fortinet.com/document/fortigate/7.6.3/administration-guide/954635'

source_type: firewall
priority: 45

check: >-
  contains($event.original, 'date=')
  AND contains($event.original, 'type="traffic')

normalize:
  - map:
      - _kv: parse_key_value($event.original, '=', ' ')
      - event.dataset: fortinet.traffic
      - event.kind: event
      - event.category: array_append(network)
      - observer.vendor: Fortinet
      - observer.product: FortiGate
      - observer.type: firewall
      - host.name: get_key_in($_kv, 'devname')
      - observer.name: get_key_in($_kv, 'devname')
      - event.code: get_key_in($_kv, 'logid')
      - event.action: get_key_in($_kv, 'action')
      - source.ip: get_key_in($_kv, 'srcip')
      - source.port: parse_long(get_key_in($_kv, 'srcport'))
      - source.nat.ip: get_key_in($_kv, 'transip')
      - source.nat.port: parse_long(get_key_in($_kv, 'transport'))
      - source.domain: get_key_in($_kv, 'srcdomain')
      - source.user.name: get_key_in($_kv, 'unauthuser')
      - source.bytes: parse_long(get_key_in($_kv, 'sentbyte'))
      - source.packets: parse_long(get_key_in($_kv, 'sentpkt'))
      - destination.ip: get_key_in($_kv, 'dstip')
      - destination.port: parse_long(get_key_in($_kv, 'dstport'))
      - destination.nat.ip: get_key_in($_kv, 'tranip')
      - destination.nat.port: parse_long(get_key_in($_kv, 'tranport'))
      - destination.bytes: parse_long(get_key_in($_kv, 'rcvdbyte'))
      - destination.packets: parse_long(get_key_in($_kv, 'rcvdpkt'))
      - network.protocol: downcase(get_key_in($_kv, 'service'))
      - network.application: get_key_in($_kv, 'app')
      - network.iana_number: get_key_in($_kv, 'proto')
      - rule.id: get_key_in($_kv, 'policyid')
      - rule.name: get_key_in($_kv, 'policyname')
      - rule.uuid: get_key_in($_kv, 'poluuid')
      - rule.description: get_key_in($_kv, 'comment')
      - user.group.name: get_key_in($_kv, 'group')
      - file.name: get_key_in($_kv, 'filename')
      - http.response.status_code: parse_long(get_key_in($_kv, 'statuscode'))

  # Action mapping
  - check: string_equal($event.action, 'accept') OR string_equal($event.action, 'start')
    map:
      - event.type: array_append(allowed)
      - event.outcome: success

  - check: string_equal($event.action, 'deny') OR string_equal($event.action, 'drop')
    map:
      - event.action: connection-denied
      - event.type: array_append(denied)
      - event.outcome: failure

  - check: string_equal($event.action, 'start')
    map:
      - event.type: array_append(start)

  - check: string_equal($event.action, 'close') OR string_equal($event.action, 'ip-conn')
    map:
      - event.type: array_append(end)

  - check: exists($source.ip)
    map:
      - related.ip: array_append_unique($source.ip)

  - check: exists($destination.ip)
    map:
      - related.ip: array_append_unique($destination.ip)

  - check: exists($source.user.name)
    map:
      - related.user: array_append_unique($source.user.name)

  - map:
      - _kv: delete()

normalize:
  - map:
      - event.dataset: fortinet.traffic
      - event.kind: event
      - event.category: array_append(network)
      - event.outcome: unknown
      - observer.vendor: Fortinet
      - observer.product: FortiGate
      - observer.type: firewall
      - _kv: parse_key_value($event.original, '=', ' ')
      - source.ip: get_key_in($_kv, 'srcip')
      - source.port: parse_long(get_key_in($_kv, 'srcport'))
      - source.nat.ip: get_key_in($_kv, 'transip')
      - source.nat.port: parse_long(get_key_in($_kv, 'transport'))
      - destination.ip: get_key_in($_kv, 'dstip')
      - destination.port: parse_long(get_key_in($_kv, 'dstport'))
      - network.transport: downcase(get_key_in($_kv, 'proto'))
      - network.application: get_key_in($_kv, 'app')
  - check: string_equal($network.transport, '6')
    map:
      - network.transport: tcp
  - check: string_equal($network.transport, '17')
    map:
      - network.transport: udp
  - check: string_equal($network.transport, '1')
    map:
      - network.transport: icmp
  - check: string_equal($network.transport, '58')
    map:
      - network.transport: ipv6-icmp
      - network.bytes: parse_long(get_key_in($_kv, 'sentbyte'))
      - destination.bytes: parse_long(get_key_in($_kv, 'rcvdbyte'))
      - rule.id: get_key_in($_kv, 'policyid')
      - rule.name: get_key_in($_kv, 'policyname')
      - user.name: get_key_in($_kv, 'user')
      - host.name: get_key_in($_kv, 'srcname')
      - observer.name: get_key_in($_kv, 'devname')
      - event.duration: parse_long(get_key_in($_kv, 'duration'))
      - message: get_key_in($_kv, 'msg')
      - _tmp.action: get_key_in($_kv, 'action')

  - check: string_equal($_tmp.action, 'accept')
    map:
      - event.type: array_append(allowed)
      - event.outcome: success

  - check: string_equal($_tmp.action, 'deny')
    map:
      - event.action: connection-denied
      - event.type: array_append(denied)
      - event.outcome: failure

  - check: string_equal($_tmp.action, 'close')
    map:
      - event.type: array_append(end)

  - check: exists($source.ip)
    map:
      - related.ip: array_append_unique($source.ip)

  - check: exists($destination.ip)
    map:
      - related.ip: array_append_unique($destination.ip)

  - check: exists($user.name)
    map:
      - related.user: array_append_unique($user.name)

  - map:
      - _kv: delete()
      - _tmp: delete()
