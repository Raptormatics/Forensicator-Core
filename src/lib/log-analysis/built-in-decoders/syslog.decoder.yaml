name: decoder/syslog/0
enabled: true

metadata:
  title: Syslog / Linux Auth
  author: Forensicator
  date: '2026-06-24'
  description: >-
    Generic syslog format, with either an RFC 3164 timestamp or the RFC 3339
    one rsyslog writes by default on current Ubuntu/Debian (and
    `journalctl -o short-iso`). Also handles auth.log and kern.log.
    Example: Jun 24 10:00:00 myhost sshd[1234]: Accepted password for john from 10.0.0.5 port 22 ssh2
    Example: 2026-10-25T21:10:03.340538+00:00 myhost sshd[1234]: Accepted publickey for john from 10.0.0.5 port 22 ssh2

check: >-
  regex_match($event.original, '^[A-Z][a-z]{2} ')
  OR regex_match($event.original, '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:')

parse|event.original:
  - '<@timestamp/SYSLOG> <host.hostname> <process.name>[<process.pid/long>]: <message>'
  - '<@timestamp/SYSLOG> <host.hostname> <process.name>: <message>'
  - '<@timestamp/SYSLOG> <host.hostname> <message>'
  - '<@timestamp/ISO8601> <host.hostname> <process.name>[<process.pid/long>]: <message>'
  - '<@timestamp/ISO8601> <host.hostname> <process.name>: <message>'
  - '<@timestamp/ISO8601> <host.hostname> <message>'

normalize:
  - map:
      - event.dataset: syslog
      - event.kind: event
      - observer.product: Syslog
  - check: contains($message, 'Accepted password') OR contains($message, 'Accepted publickey')
    map:
      - event.category: array_append(authentication)
      - event.type: array_append(start)
      - event.outcome: success
  - check: contains($message, 'Failed password')
    map:
      - event.category: array_append(authentication)
      - event.type: array_append(start)
      - event.outcome: failure
  - check: contains($message, 'Invalid user')
    map:
      - event.category: array_append(authentication)
      - event.outcome: failure
  - check: contains($message, 'sudo')
    map:
      - event.category: array_append(process)
      - event.type: array_append(start)
  # The syslog "host" field is usually a name; only an address is an IP.
  - check: regex_match($host.hostname, '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') OR regex_match($host.hostname, '^[0-9a-fA-F:]+:[0-9a-fA-F:]+$')
    map:
      - related.ip: array_append_unique($host.hostname)
