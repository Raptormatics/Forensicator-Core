name: decoder/mysql-error/0
enabled: true

metadata:
  title: 'MySQL Error Log Decoder'
  author: 'Forensicator'
  date: '2026-06-24'
  description: >-
    Decoder for MySQL server error log. Captures log level, thread ID,
    and error messages. Useful for detecting unauthorised query attempts,
    privilege escalation via UDF, database corruption, and unexpected
    connection patterns during post-compromise analysis.
  references:
    - 'https://dev.mysql.com/doc/refman/8.0/en/error-log.html'

source_type: custom-json
priority: 40

check: >-
  regex_match($event.original, '^\d+-\d+-\d+T\S+\s\d+\s+\[') OR
  regex_match($event.original, '^\d{6}\s+\d+:\d+:\d+\s+\[') OR
  regex_match($event.original, '^\d{4}-\d{2}-\d{2}\s+\d+:\d+:\d+\s+\d+\s+\[')

normalize:
  # One block replaces the two conflicting `normalize:` versions this file
  # shipped with (a duplicate YAML key, so the decoder never loaded). Values
  # are extracted in two steps (_tmp.* then parse/downcase) because the
  # engine cannot nest a function call around a regex with a capture group.
  - map:
      - event.kind: event
      - event.category: array_append(host)
      - event.dataset: mysql.error
      - event.outcome: unknown
      - service.type: mysql
      - observer.vendor: MySQL
      - observer.type: database
      # 2024-01-15T10:23:45.123456Z 42 [ERROR] [MY-012345] [Server] message
      # 2016-12-09T12:08:33.335060Z 0 [Warning] message
      # 240115 10:23:45 [ERROR] message (5.x)
      - _tmp.ts: regex_extract($event.original, '^(\d{4}-\d{2}-\d{2}T[\d:.]+Z?)')
      - event.start: $_tmp.ts
      - '@timestamp': $_tmp.ts
      - _tmp.thread: regex_extract($event.original, '^\S+\s+(\d+)\s+\[')
      - process.thread.id: parse_long($_tmp.thread)
      - _tmp.level: regex_extract($event.original, '\[([A-Za-z]+)\]')
      - log.level: downcase($_tmp.level)
      - event.code: regex_extract($event.original, '\[MY-(\d+)\]')
      - message: regex_extract($event.original, '^\S+(?:\s+\S+)?\s+\[[A-Za-z]+\]\s+(?:\[MY-\d+\]\s+\[[A-Za-z]+\]\s+)?(.+)$')

  - check: string_equal($log.level, 'error')
    map:
      - event.type: array_append(error)
      - event.outcome: failure

  - check: string_equal($log.level, 'warning') OR string_equal($log.level, 'note') OR string_equal($log.level, 'system')
    map:
      - event.type: array_append(info)

  # Failed logins: Access denied for user 'root'@'10.0.0.9' (using password: YES)
  - check: contains($event.original, 'Access denied for user')
    map:
      - event.category: array_append(authentication)
      - event.action: authentication-failure
      - event.outcome: failure
      - user.name: regex_extract($event.original, 'for user .([^@]+?).@')
      - source.ip: regex_extract($event.original, 'for user .[^@]+?.@.([0-9A-Fa-f:.]+).')

  # Brute force lock-out: Host '10.0.0.70' is blocked because of many connection errors
  - check: contains($event.original, 'is blocked because of many connection errors')
    map:
      - event.category: array_append(network)
      - event.action: host-blocked
      - source.ip: regex_extract($event.original, 'Host .([0-9A-Fa-f:.]+). is blocked')

  - check: exists($user.name)
    map:
      - related.user: array_append_unique($user.name)

  - check: exists($source.ip)
    map:
      - related.ip: array_append_unique($source.ip)

  - map:
      - _tmp: delete()
