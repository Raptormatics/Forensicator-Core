name: decoder/zeek-smb-cmd/0
enabled: true

metadata:
  title: 'Zeek SMB Command Log Decoder'
  author: 'Forensicator'
  date: '2026-06-24'
  description: >-
    Decoder for Zeek smb_cmd.log. Records SMB commands including file reads,
    writes, creates, and deletes. Essential for detecting lateral movement
    via SMB, ransomware file encryption patterns, and ADMIN$ share exploitation.
  references:
    - 'https://docs.zeek.org/en/master/logs/smb.html'

source_type: custom-json
priority: 42

check: >-
  exists(ts) AND exists(command) AND exists(version)

normalize:
  - map:
      - event.kind: event
      - event.category: array_append(network)
      - event.type: array_append(access)
      - event.dataset: zeek.smb_cmd
      - event.id: event.original.uid
      - event.action: event.original.command
      - event.reason: event.original.argument
      - network.transport: tcp
      - network.protocol: smb
      - source.ip: event.original.id.orig_h
      - source.port: parse_long(event.original.id.orig_p)
      - destination.ip: event.original.id.resp_h
      - destination.port: parse_long(event.original.id.resp_p)
      - network.application: event.original.version
      - user.name: event.original.username
      - url.path: event.original.tree
      - network.community_id: event.original.tree_service
      - file.name: event.original.referenced_file.name
      - observer.vendor: Zeek
      - observer.type: network
      - related.ip: array_append_unique($source.ip)
      - related.ip: array_append_unique($destination.ip)

  # SMB success
  - check: regex_match(event.original.status, '^SUCCESS$')
    map:
      - event.outcome: success

  # SMB failure
  - check: exists(event.original.status) AND not_exists($event.outcome)
    map:
      - event.outcome: failure
      - event.type: array_append(error)

  - check: not_exists($event.outcome)
    map:
      - event.outcome: unknown

  - check: exists($user.name)
    map:
      - related.user: array_append_unique($user.name)
